db.showMissingCreateTableStatements=true
app.baseDomain=${BASE_DOMAIN:localhost:8080}
app.baseUrl=${BASE_URL:http://localhost:8080}
# Spring Boot will serve frontend files via port 8080
# If you are using ng serve to proxy static files built by Angular, set OSMT_FRONT_END_PORT to 4200
app.frontEndPort=${OSMT_FRONT_END_PORT:8080}
app.frontendUrl=http://localhost:${app.frontEndPort}
# Include both 8080 and 4200 in CORS for local development
# Port 4200 is the default Angular dev server port
app.security.cors.allowedOrigins=${app.baseUrl},${app.frontendUrl},http://localhost:4200
management.endpoint.health.show-details=always
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
# Common debuging log levels for OSMT development
# Sync debug: uncomment to trace batch fetches, watermark advancement, and per-record processing
#logging.level.edu.wgu.osmt.credentialengine=DEBUG
#logging.level.org.springframework.data.elasticsearch.client.WIRE=trace
#logging.level.org.elasticsearch.client.RestClient=DEBUG
#logging.level.org.springframework=DEBUG
#logging.level.edu.wgu.osmt=DEBUG

# Default admin credentials for single-auth profile in development mode
app.single-auth.admin-username=admin
app.single-auth.admin-password=admin

# Session token secret placeholder for local development only (not for production)
app.sessionTokenSecret=ZGV2LXBsYWNlaG9sZGVyLWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LW5vdC1mb3ItcHJvZA==

# Sync SQL logging: uncomment to see Exposed-generated SQL (for cursor debugging)
#logging.level.Exposed=DEBUG

# CE sync dev features: label prefix, unpublish-all, example.org ExactAlignment
credential-engine.label-prefix=${CREDENTIAL_ENGINE_LABEL_PREFIX:(osmt-dev)}
credential-engine.canonical-url-base=${CREDENTIAL_ENGINE_CANONICAL_URL_BASE:https://example.org}
credential-engine.allow-unpublish-all=${CREDENTIAL_ENGINE_ALLOW_UNPUBLISH_ALL:true}