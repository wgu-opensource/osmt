# Read-only public instance (optional split deployment). Use with:
# spring.profiles.active=readonly
# Meta-config: disables writes, sessions, and login-capable auth paths.

spring.flyway.enabled=false
spring.session.store-type=none

app.readOnlyMode=true
app.singleAuthEnabled=false
app.authMode=read-only
app.enableRoles=false

app.allowPublicSearching=true
app.allowPublicLists=true
