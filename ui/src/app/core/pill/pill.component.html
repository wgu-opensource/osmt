<ng-container
  *ngIf="hasClickedObservers; then buttonPill; else divPill"
></ng-container>
<ng-template #buttonPill>
  <button
    class="m-pill"
    [class.selected]="isSelected"
    [tabIndex]="tabSelectEnabled ? 0 : -1"
    type="button"
    (click)="onClick()"
  >
    <div class="m-pill-primary">{{ primaryLabel }}</div>
    <div *ngIf="hasSecondaryLabel" class="m-pill-secondary">
      {{ secondaryLabel }}
    </div>
  </button>
</ng-template>
<ng-template #divPill>
  <div class="m-pill" [class.selected]="isSelected">
    <a
      *ngIf="linkUrl"
      class="m-pill-primary t-type-bodyLink"
      [routerLink]="linkUrl"
      >{{ primaryLabel }}</a
    >
    <div *ngIf="!linkUrl" class="m-pill-primary">{{ primaryLabel }}</div>
    <div *ngIf="hasSecondaryLabel" class="m-pill-secondary">
      {{ secondaryLabel }}
    </div>
  </div>
</ng-template>
